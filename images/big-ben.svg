    </g>
    <g stroke="#12162A" stroke-linecap="round">
      <path stroke-width="3.2" d="M1120 219l-12-8"/>
      <path stroke-width="2.2" d="M1120 219l14-18"/>
    </g>
    <circle cx="1120" cy="219" r="2.6" fill="#A6503A"/>
    <!-- звонница -->
    <rect x="1080" y="132" width="80" height="42" fill="#1C2447"/>
    <g fill="#C89B3C" opacity=".45">
      <path d="M1088 170v-20a6 6 0 0 1 12 0v20zM1104 170v-20a6 6 0 0 1 12 0v20zM1124 170v-20a6 6 0 0 1 12 0v20zM1140 170v-20a6 6 0 0 1 12 0v20z"/>
    </g>
    <!-- крыша и шпиль -->
    <path fill="#262f57" d="M1076 134h88l-22-44h-44z"/>
    <path stroke="#1C2447" stroke-width="2" d="M1098 92l-10 40M1142 92l10 40M1120 92v40"/>
    <rect x="1106" y="70" width="28" height="22" fill="#1C2447"/>
    <path fill="#C89B3C" opacity=".5" d="M1112 88v-10a3 3 0 0 1 6 0v10zM1122 88v-10a3 3 0 0 1 6 0v10z"/>
    <path fill="#262f57" d="M1104 72h32l-16-58z"/>
    <path stroke="#C89B3C" stroke-width="2" d="M1120 14V2"/>
    <circle cx="1120" cy="6" r="3" fill="#C89B3C"/>
  </g>

  <!-- набережная -->
  <rect x="0" y="588" width="1440" height="12" fill="#1C2447"/>
</svg>
