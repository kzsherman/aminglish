    <rect x="1070" y="258" width="100" height="8" fill="#1C2447"/>
    <rect x="1070" y="172" width="100" height="8" fill="#1C2447"/>
    <path fill="#262f57" d="M1070 176l6-22 6 22zM1158 176l6-22 6 22z"/>
    <!-- циферблат -->
    <circle cx="1120" cy="219" r="34" fill="#C89B3C"/>
    <circle cx="1120" cy="219" r="30" fill="#F4EFE2"/>
    <circle cx="1120" cy="219" r="30" fill="#d9bd80" opacity=".25"/>
    <g stroke="#12162A" stroke-width="2.4" stroke-linecap="round">
