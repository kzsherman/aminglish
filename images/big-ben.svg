<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" preserveAspectRatio="xMidYMax meet">
  <!-- Ночной Лондон: колесо обозрения, Вестминстер и Биг-Бен. Цвета — палитра сайта -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C89B3C" stop-opacity=".35"/>
      <stop offset="1" stop-color="#C89B3C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="win" width="14" height="22" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="5" height="11" rx="2.5" fill="#C89B3C" opacity=".22"/>
    </pattern>
  </defs>

  <!-- луна -->
  <circle cx="1310" cy="105" r="36" fill="#d9bd80" opacity=".18"/>
  <circle cx="1310" cy="105" r="24" fill="#d9bd80" opacity=".22"/>

  <!-- дальний город -->
  <path fill="#1C2447" opacity=".75" d="M0 600V505h40v-30h36v40h30v-55h48v25h40v-18h52v48h30v-62h44v40h38v-22h46v52h40v-34h60v20h48v-44h42v60h34v-30h52v26h40v-40h48v36h36v-24h56v50h40v-30h58v42h34v-26h50v34h44v-20h60v44h40v-28h48v118z"/>

  <!-- колесо обозрения -->
  <g stroke="#262f57" fill="none" stroke-width="3" opacity=".9">
