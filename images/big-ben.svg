    <circle cx="250" cy="400" r="118" stroke-width="1.5"/>
    <path stroke-width="1.5" d="M250 272v256M122 400h256M159.5 309.5l181 181M340.5 309.5l-181 181M201 282l98 236M299 282l-98 236M132 351l236 98M368 351l-236 98"/>
    <path stroke-width="5" d="M250 400l-70 200M250 400l70 200"/>
  </g>
  <g fill="#C89B3C" opacity=".55">
    <circle cx="250" cy="272" r="5"/><circle cx="378" cy="400" r="5"/><circle cx="122" cy="400" r="5"/>
    <circle cx="340.5" cy="309.5" r="5"/><circle cx="159.5" cy="309.5" r="5"/><circle cx="340.5" cy="490.5" r="5"/>
    <circle cx="159.5" cy="490.5" r="5"/><circle cx="299" cy="282" r="5"/><circle cx="201" cy="282" r="5"/>
    <circle cx="368" cy="351" r="5"/><circle cx="132" cy="351" r="5"/><circle cx="368" cy="449" r="5"/><circle cx="132" cy="449" r="5"/>
  </g>

  <!-- свечение за башней -->
  <circle cx="1120" cy="215" r="150" fill="url(#glow)"/>

  <!-- здание парламента -->
  <g fill="#1C2447">
    <path d="M700 600V470h20v-26l8-18 8 18v26h40v-20l6-14 6 14v20h40v-24l7-16 7 16v24h40v-20l6-14 6 14v20h40v-26l8-18 8 18v26h40v-20l6-14 6 14v20h40V600z"/>
    <path d="M1150 600V455h30v-30l9-20 9 20v30h44v-22l7-16 7 16v22h44v-26l8-18 8 18v26h44v-20l6-14 6 14v20h40V600z"/>
